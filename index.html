<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Interaktif</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-soft: #dbeafe;
    --success: #16a34a;
    --danger: #dc2626;
    --text: #1f2937;
    --bg: #f9fafb;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 800px;
    width: 100%;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }

  h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
  
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
  .input-group input {
    width: 100%; padding: 12px; border: 2px solid #e5e7eb; 
    border-radius: 8px; font-size: 16px; box-sizing: border-box;
  }

  .btn {
    padding: 12px 24px; border: none; border-radius: 8px; 
    font-size: 16px; font-weight: 600; cursor: pointer; 
    transition: all 0.2s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #1d4ed8; transform: translateY(-2px); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }

  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    margin: 10px 0;
    background: #f3f4f6;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .option-btn:hover {
    background: #e5e7eb;
    border-color: #d1d5db;
  }

  .option-btn.selected {
    background-color: var(--primary-soft) !important;
    border-color: var(--primary) !important;
    color: #1e3a8a !important;
    font-weight: 700 !important;
    transform: scale(1.02);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
  }

  .option-btn:active {
    transform: scale(0.98);
  }

  .status-box {
    padding: 15px; border-radius: 8px; margin-top: 20px; 
    border: 2px solid #e5e7eb; text-align: center;
    transition: all 0.3s;
  }
  
  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <h1>📝 Kuis Interaktif</h1>
  
  <div id="formNama" class="input-group">
    <label for="namaSiswa">Masukkan Nama Lengkap:</label>
    <input type="text" id="namaSiswa" placeholder="Contoh: Budi Santoso">
    <button class="btn btn-primary" onclick="mulaiKuis()" style="margin-top:10px; width:100%;">Mulai Kuis</button>
  </div>

  <div id="areaKuis" class="hidden">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <span id="progressTeks" style="font-weight:600;">Soal 1 dari 3</span>
      <span id="namaDisplay" style="color:#6b7280;"></span>
    </div>
    
    <h2 id="pertanyaanTeks" style="margin-bottom:20px;"></h2>
    <div id="pilihanJawaban"></div>
    
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-primary" id="btnPrev" onclick="navigasi(-1)" disabled>← Sebelumnya</button>
      <button class="btn btn-primary" id="btnNext" onclick="navigasi(1)">Selanjutnya →</button>
      <button class="btn btn-primary hidden" id="btnSelesai" onclick="selesaiKuis()" style="background:#16a34a;">Selesai & Kirim</button>
    </div>
  </div>

  <div id="statusKirim" class="status-box hidden">
    <p id="statusTeks" style="margin:0; font-weight:600;">Mengirim hasil...</p>
  </div>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzMJBl1AR2cybR1nH_6hCZYMWKR57mmMWi0c-wWrIyraEsZOb1M0DUPsD1O_j0j38h_/exec';

  const soalList = [
    { q: "Apa ibukota Indonesia?", o: ["Jakarta", "Bandung", "Surabaya", "Medan"], a: 0 },
    { q: "Berapa hasil dari 15 + 25?", o: ["30", "35", "40", "45"], a: 2 },
    { q: "Siapa penemu lampu pijar?", o: ["Newton", "Edison", "Einstein", "Tesla"], a: 1 }
  ];

  let soalAktif = 0;
  let namaSiswa = "";
  let jawabanSiswa = new Array(soalList.length).fill(null);

  function mulaiKuis() {
    namaSiswa = document.getElementById('namaSiswa').value.trim();
    if (!namaSiswa) { alert("Mohon isi nama terlebih dahulu!"); return; }
    
    document.getElementById('formNama').classList.add('hidden');
    document.getElementById('areaKuis').classList.remove('hidden');
    document.getElementById('namaDisplay').textContent = "Halo, " + namaSiswa;
    tampilkanSoal();
  }

  function tampilkanSoal() {
    const soal = soalList[soalAktif];
    document.getElementById('progressTeks').textContent = `Soal ${soalAktif + 1} dari ${soalList.length}`;
    document.getElementById('pertanyaanTeks').textContent = soal.q;
    
    const container = document.getElementById('pilihanJawaban');
    container.innerHTML = '';
    
    soal.o.forEach((opsi, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = String.fromCharCode(65 + i) + ". " + opsi;
      
      if (jawabanSiswa[soalAktif] === i) {
        btn.classList.add('selected');
      }
      
      btn.onclick = () => pilihJawaban(i);
      container.appendChild(btn);
    });

    document.getElementById('btnPrev').disabled = (soalAktif === 0);
    
    const isLast = (soalAktif === soalList.length - 1);
    document.getElementById('btnNext').classList.toggle('hidden', isLast);
    document.getElementById('btnSelesai').classList.toggle('hidden', !isLast);
  }

  function pilihJawaban(idx) {
    jawabanSiswa[soalAktif] = idx;
    const btns = document.querySelectorAll('.option-btn');
    
    btns.forEach((btn, i) => {
      if (i === idx) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    });
  }

  function navigasi(arah) {
    soalAktif += arah;
    tampilkanSoal();
  }

  function selesaiKuis() {
    let benar = 0, salah = 0, kosong = 0;
    jawabanSiswa.forEach((j, i) => {
      if (j === null) kosong++;
      else if (j === soalList[i].a) benar++;
      else salah++;
    });
    
    const nilai = Math.round((benar / soalList.length) * 100);
    
    kirimKeSpreadsheet(namaSiswa, nilai, benar, salah, kosong, jawabanSiswa);
  }

  function kirimKeSpreadsheet(nama, nilai, benar, salah, kosong, jawaban) {
    const statusBox = document.getElementById('statusKirim');
    const statusTeks = document.getElementById('statusTeks');
    
    statusBox.classList.remove('hidden');
    statusBox.style.background = '#fef9c3';
    statusBox.style.borderColor = '#ca8a04';
    statusTeks.textContent = '⏳ Sedang mengirim hasil ke guru...';
    statusTeks.style.color = '#854d0e';

    const data = {
      timestamp: new Date().toLocaleString('id-ID'),
      nama: nama,
      nilai: nilai,
      benar: benar,
      salah: salah,
      kosong: kosong,
      detail_jawaban: jawaban.map((j, i) => {
        if (j === null) return `${i+1}-`;
        return `${i+1}${String.fromCharCode(65 + j)}`;
      }).join(', ')
    };

    fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      statusBox.style.background = '#dcfce7';
      statusBox.style.borderColor = '#16a34a';
      statusTeks.textContent = `✅ Berhasil! Nilai Anda: ${nilai}. Hasil sudah dikirim ke guru.`;
      statusTeks.style.color = '#166534';
      
      document.getElementById('areaKuis').classList.add('hidden');
    })
    .catch(error => {
      console.error('Error:', error);
      statusBox.style.background = '#fee2e2';
      statusBox.style.borderColor = '#dc2626';
      statusTeks.textContent = '❌ Gagal mengirim. Periksa koneksi internet Anda.';
      statusTeks.style.color = '#991b1b';
    });
  }
</script>

</body>
</html>
